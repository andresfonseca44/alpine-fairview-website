[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/card"
  to = "/card.html"
  status = 200

[[redirects]]
  from = "/andres"
  to = "/card.html"
  status = 200

[[redirects]]
  from = "/jamesfrank"
  to = "/jamesfrank.html"
  status = 200

[[redirects]]
  from = "/james-frank"
  to = "/jamesfrank.html"
  status = 200

[[redirects]]
  from = "/JamesFrank"
  to = "/jamesfrank.html"
  status = 200

[[redirects]]
  from = "/life/term-life-policies"
  to = "/whole-life-policies.html"
  status = 200

[[redirects]]
  from = "/life/term-life-policies/"
  to = "/whole-life-policies.html"
  status = 200

[[redirects]]
  from = "/life-insurance"
  to = "/whole-life-policies.html"
  status = 200

[[redirects]]
  from = "/life-insurance/"
  to = "/whole-life-policies.html"
  status = 200

[[redirects]]
  from = "/about-us"
  to = "/index.html#about-us"
  status = 302

[[redirects]]
  from = "/about-us/"
  to = "/index.html#about-us"
  status = 302

# Unlisted advisor contact pages: never index, even if a URL leaks.
[[headers]]
  for = "/jamesfrank.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  for = "/card.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
